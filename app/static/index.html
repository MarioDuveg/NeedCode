<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoGrader · Python</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">A</span><strong>AlgoGrader</strong></div>
    <div class="top-meta"><span>Python 3</span><span class="dot">•</span><span id="overall">Calificación: 0.0 / 10</span></div>
  </header>

  <main class="workspace">
    <aside class="problem-list" id="problem-list"></aside>

    <section class="problem-pane">
      <div class="problem-header">
        <div>
          <div class="eyebrow" id="difficulty"></div>
          <h1 id="title">Cargando…</h1>
        </div>
        <div class="score-card"><span>Este problema</span><strong id="score">— / 10</strong></div>
      </div>
      <p class="statement" id="statement"></p>
      <div class="signature" id="signature"></div>
      <h2>Ejemplos</h2>
      <div id="examples" class="examples"></div>
    </section>

    <section class="editor-pane">
      <div class="editor-toolbar">
        <div><strong>Solución</strong><span class="language">Python</span></div>
        <div class="anti-paste" title="El editor bloquea pegar y arrastrar texto">Pegado bloqueado</div>
      </div>
      <div class="editor-wrap">
        <pre id="line-numbers" aria-hidden="true">1</pre>
        <div class="code-editor">
          <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Editor de código Python"></textarea>
        </div>
      </div>
      <div id="paste-warning" class="paste-warning" hidden>No se permite pegar código. Escríbelo directamente en el editor.</div>
      <div class="actions">
        <span id="status">Listo.</span>
        <button id="reset" class="secondary">Restablecer</button>
        <button id="submit">Enviar solución</button>
      </div>
      <div class="results" id="results">
        <div class="empty-results">Los resultados de los 10 casos aparecerán aquí.</div>
      </div>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
